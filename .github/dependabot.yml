version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Lockstep groups: these packages peer-pin each other, so bumping one
      # without the other fails `npm ci`. They must also be excluded from the
      # dependency-type groups below — Dependabot ranks a dependency-type
      # group as more specific than a pattern group and would otherwise pull
      # them out (this split vitest 5 into two failing PRs).
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
      react:
        patterns:
          - react
          - react-dom
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - vitest
          - "@vitest/*"
          - eslint
          - "@eslint/*"
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - react
          - react-dom

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
